<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portal polimdo</title>
    <link rel="stylesheet" href="style.css">
    <style>
      body {
        background-image: url("backgraund.jpeg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="logo.png" alt="logo" class="logo">
              <h2>PORTAL ACADEMIC POLIMDO</h2>
        <form onsubmit="return validateLogin()">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <p id="error-message"></p>
</div>

<script>
  function validateLogin() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const errorMessage = document.getElementById("error-message");

    // Ganti sesuai username dan password yang kamu inginkan
    const correctUsername = "31052006";
    const correctPassword = "politeknik";

    if (username === correctUsername && password === correctPassword) {
  window.location.href = "dashboard.html"; // ke halaman setelah login
  return false; // stop form submit karena sudah redirect

    } else {
      errorMessage.textContent = "Username atau password salah!";
      return false;
    }
  }
</script>

</body>
</html>
